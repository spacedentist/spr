name: "Lint, format, test"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linter
        id: lint
        if: "!cancelled()"
        run: cargo clippy --workspace --all-targets --all-features

      - name: Code formatter
        id: format
        if: "!cancelled()"
        run: cargo fmt --all --check

      - name: Tests
        id: test
        if: "!cancelled()"
        run: cargo test --workspace --all-features

  # Check that spr builds with the minimum supported Rust version, as
  # declared in Cargo.toml (`rust-version`). Lints are the job above's
  # business: older compilers may warn differently.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install the minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "Rust $msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Build
        run: cargo "+$MSRV" check --locked --workspace --all-targets --all-features
