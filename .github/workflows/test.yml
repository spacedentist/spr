name: "Lint, format, test"

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the checks of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Linter
        id: lint
        if: "!cancelled()"
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Code formatter
        id: format
        if: "!cancelled()"
        run: cargo fmt --all --check

      - name: Tests
        id: test
        if: "!cancelled()"
        run: cargo test --locked --workspace --all-features

  # Check that spr builds with the minimum supported Rust version, as
  # declared in Cargo.toml (`rust-version`). Lints are the job above's
  # business: older compilers may warn differently.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install the minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "Rust $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo check --locked --workspace --all-targets --all-features
