[package]
name = "spr-livetest"
version = "0.0.0"
description = "Live tests of spr against Git forges (not part of spr itself)"
license = "MIT"
edition = "2024"
rust-version = "1.91"
publish = false


# One binary per forge, so far only GitHub
[[bin]]
name = "spr-github-livetest"
path = "src/main.rs"

[dependencies]
clap = { version = "^4.6.7", features = ["derive", "wrap_help"] }
color-eyre = "0.6.5"
http = "1.5.0"
octocrab = { version = "^0.54.2", default-features = false, features = [
  "opentls",
  "default-client",
  "tokio",
  "jwt-rust-crypto",
] }
serde_json = "^1.0"
tempfile = "^3.27.0"
tokio = { version = "^1.53.1", features = ["rt"] }
